.live-dot{

width:7px;

background:var(--green);

animation:pulse 1.4s infinite;

}



@keyframes pulse{

0%,100%{

opacity:1;

transform:scale(1);

}


50%{

opacity:.4;

transform:scale(.7);

}

}

/* ================= HERO ================= */

border-radius:20px;

padding:32px 28px;

display:grid;

grid-template-columns:1fr auto;

gap:24px;

align-items:center;

margin-bottom:20px;

position:relative;

overflow:hidden;

}



.hero::before{

content:"";

position:absolute;

top:-60px;

right:-60px;

width:220px;

height:220px;

background:var(--green-glow);

border-radius:50%;

<!-- ÁUDIO DA RÁDIO -->

<audio id="audio">
<source src="https://oven-quad-karl-queue.trycloudflare.com/stream">
</audio>



<script>

const audio = document.getElementById("audio");

const playIcon = document.getElementById("playIcon");

const vol = document.getElementById("vol");

let playing = false;



audio.volume = 0.6;



// CONTROLE DE VOLUME

vol.oninput = function(){

audio.volume = this.value;

};






// PLAY / PAUSE

function togglePlay(){


if(!playing){


audio.play().then(()=>{


playing=true;


playIcon.className="fas fa-pause";


document.getElementById("playerStatus").innerHTML=
"🔴 Ao Vivo · Transmitindo";



document.getElementById("liveBadge").style.display="flex";



document.getElementById("npTitle").innerHTML=
"Transmissão ao vivo";



document.getElementById("npSub").innerHTML=
"Radio Palavra Inspirando Vida - WEB · Gospel 24h";



document.getElementById("waveform")
.classList.remove("paused");



document.getElementById("spinRing")
.style.animationPlayState="running";



document.getElementById("speaker")
.classList.add("playing");



}).catch(()=>{

alert("Clique novamente para iniciar o áudio");

});


}else{


audio.pause();


playing=false;


playIcon.className="fas fa-play";



document.getElementById("playerStatus").innerHTML=
"Offline · Clique para ouvir";



document.getElementById("liveBadge")
.style.display="none";



document.getElementById("npTitle").innerHTML=
"Aguardando transmissão…";



document.getElementById("npSub").innerHTML=
"Clique em Play para ouvir";



document.getElementById("waveform")
.classList.add("paused");



document.getElementById("spinRing")
.style.animationPlayState="paused";



document.getElementById("speaker")
.classList.remove("playing");


}


}









// RELÓGIO + PROGRAMAÇÃO AUTOMÁTICA


function updateClock(){


let now=new Date();


let h=String(now.getHours()).padStart(2,"0");

let m=String(now.getMinutes()).padStart(2,"0");

let s=String(now.getSeconds()).padStart(2,"0");



document.getElementById("clock").innerHTML=
`${h}:${m}:${s}`;



let hora=now.getHours();



let slots=[

"slot1",
"slot2",
"slot3"

];



slots.forEach(id=>{


let el=document.getElementById(id);


if(el){

el.classList.remove("active-slot");

}


});




let ativo=null;



if(hora<8){

ativo="slot1";

}

else if(hora<13){

ativo="slot2";

}

else if(hora<19){

ativo="slot3";

}





if(ativo){


let el=document.getElementById(ativo);


el.classList.add("active-slot");



let badge=
el.querySelector(".schedule-badge");



if(badge){

badge.className=
"schedule-badge badge-live";


badge.innerHTML="Agora";


}



}



}



setInterval(updateClock,1000);

updateClock();








// SISTEMA DE ABAS


function switchTab(id,btn){



document.querySelectorAll(".tab-panel")
.forEach(p=>{

p.classList.remove("active");

});



document.querySelectorAll(".tab-btn")
.forEach(b=>{

b.classList.remove("active");

});



document.getElementById(id)
.classList.add("active");



btn.classList.add("active");



}









// ENVIO DE PEDIDOS


function enviarPedido(){



let n=
document.getElementById("nome").value.trim();



let m=
document.getElementById("musicaInput").value.trim();



let c=
document.getElementById("cantor").value.trim();



let ci=
document.getElementById("cidade").value.trim();





if(!n || !m || !c){


alert("Preencha nome, música e cantor");

return;


}




let pedidos=
JSON.parse(localStorage.getItem("pedidos")||"[]");




pedidos.unshift({

nome:n,

musica:m,

cantor:c,

cidade:ci,

hora:new Date().toLocaleTimeString()

});





localStorage.setItem(

"pedidos",

JSON.stringify(pedidos)

);





document.getElementById("nome").value="";

document.getElementById("cidade").value="";

document.getElementById("musicaInput").value="";

document.getElementById("cantor").value="";





alert("Pedido enviado com sucesso 🎵");



}

function abrirAdmin(){

}

}

function carregarPedidos(){


let lista=
document.getElementById("adminLista");



let pedidos=
JSON.parse(localStorage.getItem("pedidos")||"[]");




if(pedidos.length===0){


lista.innerHTML=
`
<div class="admin-empty">

<i class="fas fa-inbox"></i>

<br>

Nenhum pedido ainda

</div>
`;

return;


}





lista.innerHTML=
pedidos.map(p=>`


<div class="request-item">


<div class="request-avatar">

${p.nome.charAt(0).toUpperCase()}

</div>



<div>


<div class="request-name">

${p.nome}

${p.cidade ? " · "+p.cidade : ""}

</div>



<div class="request-song">

${p.musica} — ${p.cantor}

<br>

<span>

${p.hora}

</span>

</div>



</div>



</div>


`).join("");



}









// ===============================
// CONTADOR DE OUVINTES ICECAST
// ===============================


async function atualizarOuvintes(){



try{


const resposta =
await fetch(
"https://SEU-LINK.trycloudflare.com/admin/stats?mode=xml"
);



const texto =
await resposta.text();



const xml =
new DOMParser()
.parseFromString(texto,"text/xml");



const ouvintes =
xml.querySelector("listeners");



if(ouvintes){



document.getElementById("ouvintes-count")
.innerHTML=
ouvintes.textContent;



}



}catch(e){



console.log("Servidor offline");


}



}



atualizarOuvintes();


setInterval(
atualizarOuvintes,
5000
);









// ===============================
// MANTER TELA LIGADA (WAKE LOCK)
// ===============================


let wakeLock=null;



async function manterTelaAcesa(){



try{



if("wakeLock" in navigator){



wakeLock =
await navigator.wakeLock.request("screen");



console.log(
"Tela mantida ligada"
);



wakeLock.addEventListener(
"release",
()=>{

console.log(
"Wake Lock liberado"
);

}

);



}



}catch(err){



console.log(err);


}



}




manterTelaAcesa();






document.addEventListener(
"visibilitychange",
async()=>{


if(
wakeLock !== null &&
document.visibilityState==="visible"
){


wakeLock =
await navigator.wakeLock.request("screen");


}


});



</script>
